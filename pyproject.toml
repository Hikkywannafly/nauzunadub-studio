[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nauzunadub-studio"
version = "0.1.0"
description = "Nauzunadub Studio — local-first video dubbing app (YouTube/file → transcribe → translate → re-voice → MP4)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["dubbing", "tts", "voice-cloning", "video", "translation", "whisperx"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video :: Conversion",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=5.3.0",
    "accelerate",
    "pydub",
    "numpy",
    "soundfile",
    "setuptools>=75.0",
    "psutil>=7.2.2",
    "pyannote-audio>=3.3.2,<4.0",
    "imageio-ffmpeg>=0.6.0",
    "pedalboard>=0.9.14",
    "whisperx>=3.1.0",
    "faster-whisper>=1.0.0",
    "mlx-whisper>=0.2.1 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio>=0.3.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "demucs>=4.0.1",
    "yt-dlp>=2024.12.13",
    "audioseal>=0.1.3",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "websockets",
    "python-dotenv",
    "openai>=1.0",
    "httpx>=0.28",
    "deep-translator>=1.11",
]

[project.optional-dependencies]
# KittenTTS is a developer-preview wheel; make it optional so first-install
# is reliable on networks that can't reach the GitHub Releases URL.
kitten = [
    "kittentts @ https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
constraint-dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["backend", "omnivoice"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
norecursedirs = [".venv", "node_modules", "frontend"]
